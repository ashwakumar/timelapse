[project]
name = "aeroguard-tslm"
version = "0.1.0"
description = "AeroGuard TSLM: Multimodal Temporal AI for Turbofan Predictive Maintenance"
requires-python = ">=3.11"
dependencies = [
    "timenet>=0.1.0",
    "timenet-connectors>=0.1.0",
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "peft>=0.12.0",
    "datasets>=3.0.0",
    "accelerate>=0.34.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pyarrow>=17.0.0",
    "pint>=0.24",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "rich>=13.8.0",
    "typer>=0.12.0",
    "requests>=2.31.0",
    "chronos-forecasting>=2.3.2",
]

[project.entry-points."timenet.builders"]
aeroguard = "aeroguard_connectors.builder:AeroGuardBuilder"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/aeroguard-connectors/src/aeroguard_connectors", "scripts", "training"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0.0",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages/aeroguard-connectors/src", "."]
extend-exclude = ["data", "models", "artifacts", "archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests", "packages/aeroguard-connectors/src/aeroguard_connectors/cmapss/tests", "training/tests"]
addopts = "--import-mode=importlib"

[tool.ty.src]
include = ["scripts", "packages/aeroguard-connectors/src", "training"]
