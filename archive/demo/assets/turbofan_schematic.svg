<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="casingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.2"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#EF4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="320" fill="#0B0F17" rx="12"/>

  <!-- Centerline -->
  <line x1="40" y1="160" x2="860" y2="160" stroke="#475569" stroke-dasharray="6,6" stroke-width="1.5"/>

  <!-- Nacelle / Outer Casing -->
  <path d="M 60,60 C 200,45 700,50 820,95 L 820,110 C 700,75 220,70 90,85 Z" fill="url(#casingGrad)" stroke="#64748B" stroke-width="1.5"/>
  <path d="M 60,260 C 200,275 700,270 820,225 L 820,210 C 700,245 220,250 90,235 Z" fill="url(#casingGrad)" stroke="#64748B" stroke-width="1.5"/>

  <!-- Bypass Duct Flow Arrows -->
  <path d="M 170,75 Q 480,85 780,120" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
  <path d="M 170,245 Q 480,235 780,200" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="440" y="80" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Bypass Airflow (BPR - Sensor 15)</text>

  <!-- Core Cowl & Core Engine Body -->
  <polygon points="180,115 340,125 540,130 680,125 800,140 800,180 680,195 540,190 340,195 180,205" fill="url(#coreGrad)" stroke="#475569" stroke-width="2"/>

  <!-- 1. FAN (Sensor 8: Nf, Sensor 13: NRf) -->
  <g id="fan">
    <ellipse cx="120" cy="160" rx="20" ry="85" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <path d="M 120,75 L 135,160 L 120,245" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <polygon points="75,160 120,135 120,185" fill="#0284C7"/>
    <text x="120" y="42" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FAN</text>
    <text x="120" y="285" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Nf, NRf (Sensors 8, 13)</text>
  </g>

  <!-- 2. LPC (Sensor 2: T24) -->
  <g id="lpc">
    <polygon points="200,125 260,130 260,190 200,195" fill="#1E293B" stroke="#0EA5E9" stroke-width="1.5"/>
    <line x1="220" y1="127" x2="220" y2="193" stroke="#0EA5E9" stroke-width="2"/>
    <line x1="240" y1="129" x2="240" y2="191" stroke="#0EA5E9" stroke-width="2"/>
    <text x="230" y="112" fill="#0EA5E9" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LPC</text>
    <circle cx="260" cy="130" r="4" fill="#F43F5E" filter="url(#glow)"/>
    <text x="260" y="295" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">T24 (Sensor 2)</text>
    <line x1="260" y1="134" x2="260" y2="280" stroke="#F43F5E" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  </g>

  <!-- 3. HPC (Sensor 3: T30, Sensor 7: P30, Sensor 11: Ps30, Sensor 9: Nc) -->
  <g id="hpc">
    <polygon points="280,132 400,138 400,182 280,188" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <line x1="305" y1="133" x2="305" y2="187" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="330" y1="135" x2="330" y2="185" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="355" y1="136" x2="355" y2="184" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="380" y1="137" x2="380" y2="183" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="340" y="120" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">HPC (High Press. Compressor)</text>
    <!-- Sensor Indicators -->
    <circle cx="400" cy="138" r="4" fill="#10B981" filter="url(#glow)"/>
    <text x="400" y="25" fill="#10B981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Ps30, P30 (Sensors 11, 7)</text>
    <line x1="400" y1="30" x2="400" y2="134" stroke="#10B981" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>
    <text x="375" y="280" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Nc, T30 (Sensors 9, 3)</text>
  </g>

  <!-- 4. COMBUSTOR (Sensor 12: Fuel Ratio phi) -->
  <g id="combustor">
    <polygon points="420,139 490,140 490,180 420,181" fill="#DC2626" fill-opacity="0.3" stroke="#EF4444" stroke-width="1.5"/>
    <circle cx="455" cy="160" r="10" fill="#EF4444" fill-opacity="0.6" filter="url(#glow)"/>
    <text x="455" y="130" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">COMBUSTOR</text>
    <text x="455" y="295" fill="#EF4444" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Fuel Ratio phi (Sensor 12)</text>
  </g>

  <!-- 5. HPT (Sensor 20: W31 coolant) -->
  <g id="hpt">
    <polygon points="510,138 560,135 560,185 510,182" fill="#1E293B" stroke="#F97316" stroke-width="1.5"/>
    <line x1="535" y1="137" x2="535" y2="183" stroke="#F97316" stroke-width="2"/>
    <text x="535" y="122" fill="#F97316" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HPT</text>
    <text x="535" y="280" fill="#F97316" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">W31 (Sensor 20)</text>
  </g>

  <!-- 6. LPT (Sensor 4: T50, Sensor 21: W32 coolant) -->
  <g id="lpt">
    <polygon points="580,134 660,128 660,192 580,186" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
    <line x1="605" y1="132" x2="605" y2="188" stroke="#EC4899" stroke-width="1.5"/>
    <line x1="635" y1="130" x2="635" y2="190" stroke="#EC4899" stroke-width="1.5"/>
    <text x="620" y="115" fill="#EC4899" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LPT (Turbine)</text>
    <!-- T50 Anomaly Hotspot -->
    <circle cx="660" cy="128" r="5" fill="#EF4444" filter="url(#glow)"/>
    <text x="660" y="25" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">T50 EGT (Sensor 4)</text>
    <line x1="660" y1="32" x2="660" y2="123" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="660" y="295" fill="#EC4899" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">W32 (Sensor 21)</text>
  </g>

  <!-- Exhaust Cone -->
  <polygon points="680,140 760,155 760,165 680,180" fill="#475569"/>

  <!-- Legend / Branding -->
  <text x="880" y="300" fill="#475569" font-family="system-ui, sans-serif" font-size="9" text-anchor="end">AeroGuard TSLM • NASA C-MAPSS Sensor Mapping</text>
</svg>
